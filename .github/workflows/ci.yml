name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax verification
        run: node --check api/index.js

      - name: Security audit
        # Fails the job if any high or critical CVEs are found in dependencies.
        # Fix with: npm audit fix  (or manually update the affected package)
        run: npm audit --audit-level=high
