<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AJOS</title>
  <link rel="stylesheet" href="auth.css?v=24">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AJOS">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"
      }
    }
  </script>
</head>
<body>

  <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle theme" data-tooltip="Toggle dark mode">
    <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4.5" fill="currentColor"></circle>
        <line x1="12" y1="2" x2="12" y2="4.5"></line>
        <line x1="12" y1="19.5" x2="12" y2="22"></line>
        <line x1="4.93" y1="4.93" x2="6.7" y2="6.7"></line>
        <line x1="17.3" y1="17.3" x2="19.07" y2="19.07"></line>
        <line x1="2" y1="12" x2="4.5" y2="12"></line>
        <line x1="19.5" y1="12" x2="22" y2="12"></line>
        <line x1="4.93" y1="19.07" x2="6.7" y2="17.3"></line>
        <line x1="17.3" y1="6.7" x2="19.07" y2="4.93"></line>
      </svg>
      <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21.64 13a1 1 0 0 0-1.05-.14 8.05 8.05 0 0 1-3.37.73A8.15 8.15 0 0 1 9.08 5.49a8.59 8.59 0 0 1 .25-2A1 1 0 0 0 8 2.36a10.14 10.14 0 1 0 14 11.69 1 1 0 0 0-.36-1.05z"></path>
      </svg>
  </button>


  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark-theme');
    }
  </script>

  
  <a href="index.html" class="auth-logo">
    <svg width="24" height="24" viewBox="0 0 16 16" fill="none">
      <rect width="16" height="16" rx="4" fill="currentColor"/>
      <circle cx="8" cy="8" r="3" fill="var(--bg-color, var(--bg))"/>
    </svg>
    AJOS
  </a>

  <div class="auth-container">
    <div style="text-align: left;">
      <a href="index.html" class="policy-back-btn">
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
          <path d="M9 1L3 7l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back to Home
      </a>
    </div>
    
    <div class="auth-title">Welcome back</div>
    <div class="auth-subtitle">Log in to continue your search</div>

    <div class="error-msg" id="errorMsg"></div>

    <button class="btn btn-google" id="googleBtn">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
      Continue with Google
    </button>

    <div class="divider">or</div>

    <form id="loginForm">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Type your email" required maxlength="254">
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="password-input-wrapper">
          <input type="password" id="password" name="password" placeholder="Type your password" required maxlength="128">
          <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" tabindex="-1">
            <svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-off-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="input-group" style="display:flex; align-items:center; margin-bottom: 0.75rem; justify-content: flex-start; flex-direction: row; gap: 0.5rem;">
        <input type="checkbox" id="rememberMe" style="width:auto; margin:0; padding:0; height:auto; cursor:pointer;" checked>
        <label for="rememberMe" style="margin:0; font-size:0.875rem; cursor:pointer;">Remember me</label>
      </div>

      <div class="turnstile-container">
        <div class="cf-turnstile" data-sitekey="0x4AAAAAADq8656XmN0AHUrk" data-theme="auto"></div>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">Log in</button>
    </form>

    <div class="footer-links">
      <div>Don't have an account? <a href="register.html">Sign up</a></div>
      <div style="margin-top:0.5rem;"><a href="forgot-password.html">Forgot your password?</a></div>
    </div>
  </div>
  <script type="module" src="auth.js?v=23"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Dynamic link adaptation if capacity is reached
      fetch('/api/registered-users-count')
        .then(res => res.json())
        .then(data => {
          if (data && data.isFull) {
            const signupLink = document.querySelector('a[href="register.html"]');
            if (signupLink && signupLink.parentElement) {
              signupLink.parentElement.innerHTML = `Don't have an account? <a href="register.html">Join waitlist</a>`;
            }
          }
        })
        .catch(() => {});

      const btn = document.getElementById('themeToggleBtn');
      if (btn) {
        // Initial setup
        const isDarkInitial = document.documentElement.classList.contains('dark-theme');
        btn.setAttribute('data-tooltip', isDarkInitial ? 'Toggle light mode' : 'Toggle dark mode');

        btn.addEventListener('click', () => {
          const isDarkNow = document.documentElement.classList.toggle('dark-theme');
          localStorage.setItem('theme', isDarkNow ? 'dark' : 'light');
          btn.setAttribute('data-tooltip', isDarkNow ? 'Toggle light mode' : 'Toggle dark mode');
        });
      }
    });
  </script>

</body>
</html>
