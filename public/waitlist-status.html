<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waitlist Status - AJOS</title>
  <link rel="stylesheet" href="auth.css?v=24">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AJOS">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</head>
<body>

  <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle theme" data-tooltip="Toggle dark mode">
    <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4.5" fill="currentColor"></circle>
      <line x1="12" y1="2" x2="12" y2="4.5"></line>
      <line x1="12" y1="19.5" x2="12" y2="22"></line>
      <line x1="4.93" y1="4.93" x2="6.7" y2="6.7"></line>
      <line x1="17.3" y1="17.3" x2="19.07" y2="19.07"></line>
      <line x1="2" y1="12" x2="4.5" y2="12"></line>
      <line x1="19.5" y1="12" x2="22" y2="12"></line>
      <line x1="4.93" y1="19.07" x2="6.7" y2="17.3"></line>
      <line x1="17.3" y1="6.7" x2="19.07" y2="4.93"></line>
    </svg>
    <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M21.64 13a1 1 0 0 0-1.05-.14 8.05 8.05 0 0 1-3.37.73A8.15 8.15 0 0 1 9.08 5.49a8.59 8.59 0 0 1 .25-2A1 1 0 0 0 8 2.36a10.14 10.14 0 1 0 14 11.69 1 1 0 0 0-.36-1.05z"></path>
    </svg>
  </button>

  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark-theme');
    }
  </script>

  <a href="index.html" class="auth-logo">
    <svg width="24" height="24" viewBox="0 0 16 16" fill="none">
      <rect width="16" height="16" rx="4" fill="currentColor"/>
      <circle cx="8" cy="8" r="3" fill="var(--bg-color, var(--bg))"/>
    </svg>
    AJOS
  </a>

  <div class="auth-container">
    <div style="text-align: left;">
      <a href="index.html" class="policy-back-btn">
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
          <path d="M9 1L3 7l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back to Home
      </a>
    </div>
    
    <!-- Static pre-rendered DOM: Displays immediately even if JavaScript is blocked or disabled -->
    <div id="dynamicContent" style="margin-top: 0.5rem;">
      <div class="icon-badge" id="statusBadge">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </div>

      <div class="auth-title" id="statusTitle">You're on the waitlist</div>
      <div class="auth-subtitle" id="statusSubtitle" style="line-height: 1.6; margin-bottom: 1.5rem;">
        Early access is currently capped at 20 accounts to keep searches fast and reliable. You have been placed on our priority waitlist. We will notify you as soon as a spot opens.
      </div>

      <div style="margin-top: 1.25rem;">
        <a href="index.html" class="btn btn-primary" id="primaryActionBtn" style="text-decoration: none; display: inline-block;">Return to Home</a>
      </div>

      <div class="footer-links" id="secondaryAction" style="margin-top: 1.25rem;">
        <div>Already have an account? <a href="login.html">Log in</a></div>
      </div>
    </div>
  </div>

  <script>
    // Strict HTML escaping to prevent any XSS from URL parameters
    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Theme Toggle Logic
      const btn = document.getElementById('themeToggleBtn');
      if (btn) {
        const isDarkInitial = document.documentElement.classList.contains('dark-theme');
        btn.setAttribute('data-tooltip', isDarkInitial ? 'Toggle light mode' : 'Toggle dark mode');

        btn.addEventListener('click', () => {
          const isDarkNow = document.documentElement.classList.toggle('dark-theme');
          localStorage.setItem('theme', isDarkNow ? 'dark' : 'light');
          btn.setAttribute('data-tooltip', isDarkNow ? 'Toggle light mode' : 'Toggle dark mode');
        });
      }

      // Progressive enhancement from query parameters
      const params = new URLSearchParams(window.location.search);
      const position = params.get('position');
      const email = params.get('email');
      const status = params.get('status');

      const titleEl = document.getElementById('statusTitle');
      const subtitleEl = document.getElementById('statusSubtitle');
      const primaryBtn = document.getElementById('primaryActionBtn');

      if (status === 'alreadyUser') {
        titleEl.textContent = 'Account already active';
        subtitleEl.textContent = 'You already have an active Early Access account! Please log in to continue.';
        primaryBtn.textContent = 'Continue to Log in';
        primaryBtn.href = 'login.html';
        const sec = document.getElementById('secondaryAction');
        if (sec) sec.style.display = 'none';
        return;
      }

      if (position || email) {
        const safePosition = position ? escapeHtml(position) : null;
        const safeEmail = email ? escapeHtml(email) : null;

        let details = '';
        if (safePosition) {
          details += `You are <b>#${safePosition}</b> in line for the next cohort. `;
        }
        if (safeEmail) {
          details += `We will send your invitation to <b>${safeEmail}</b> as soon as early access opens.`;
        }

        subtitleEl.innerHTML = `Early access is currently capped at 20 accounts to keep searches fast and reliable.<br><br>${details}`;
      }
    });
  </script>
</body>
</html>
